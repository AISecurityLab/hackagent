  <text class="dim" x="36" y="242">4  Guardrails</text><text class="dim" x="286" y="242" text-anchor="end">off</text>
  <rect x="20" y="256" width="282" height="30" fill="#2a1416" stroke="#ff5c5c" stroke-width="1.5"/>
  <text x="36" y="276"><tspan class="acc">5</tspan>  <tspan class="acc">Attacks</tspan></text><text x="286" y="276" text-anchor="end"><tspan class="acc">3 </tspan><tspan class="err">✗</tspan></text>
  <text x="36" y="310"><tspan class="dim">6</tspan>  Evaluation</text><text x="286" y="310" text-anchor="end"><tspan class="dim">2 </tspan><tspan class="warn">⚠</tspan></text>
  <text x="36" y="344"><tspan class="dim">7</tspan>  Execution</text><text class="ok" x="286" y="344" text-anchor="end">✓</text>

  <line class="sep" x1="12" y1="372" x2="310" y2="372"/>
  <text class="title" x="36" y="398">INSERT</text><text class="key small" x="286" y="398" text-anchor="end">Ctrl+I</text>
  <text x="36" y="426"><tspan class="ok">+</tspan> attack…</text>
  <text x="36" y="450"><tspan class="ok">+</tspan> judge…</text>
  <text x="36" y="474"><tspan class="ok">+</tspan> guardrail…</text>
  <text x="36" y="498"><tspan class="ok">+</tspan> dataset filter…</text>

  <line class="sep" x1="12" y1="520" x2="310" y2="520"/>
  <text class="title" x="36" y="546">TEMPLATES</text>
  <text x="36" y="574">Minimal <tspan class="dim">· baseline</tspan></text>
  <text x="36" y="598">Local vLLM</text>
  <text x="36" y="622">Ollama</text>
  <text x="36" y="646">Escalation ladder</text>
  <text class="err small" x="36" y="676">↺ Reset to template…</text>

  <line class="sep" x1="12" y1="700" x2="310" y2="700"/>
