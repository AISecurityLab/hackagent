  <text class="title" x="346" y="96">CAMPAIGN.YAML</text>
  <text x="1140" y="96" text-anchor="end"><tspan class="acc">Concise</tspan><tspan class="dim">  │  Expanded</tspan></text>
  <line class="sep" x1="322" y1="112" x2="1162" y2="112"/>
  <rect x="323.5" y="113" width="56" height="757.5" fill="#0d1218"/>

  <!-- current-section bar + current line -->
  <rect x="376" y="447" width="3" height="168" fill="#ff5c5c"/>
  <rect x="380" y="594" width="780" height="21" fill="#161d26"/>

  <!-- line numbers -->
  <g class="ln small">
    <text x="366" y="147">1</text><text x="366" y="168">2</text><text x="366" y="189">3</text><text x="366" y="210">4</text>
    <text x="366" y="231">5</text><text x="366" y="252">6</text><text x="366" y="273">7</text><text x="366" y="294">8</text>
    <text x="366" y="315">9</text><text x="366" y="336">10</text><text x="366" y="357">11</text><text x="366" y="378">12</text>
