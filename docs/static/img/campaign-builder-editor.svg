  <text x="1196" y="140"><tspan class="err">✗ 1 error</tspan><tspan class="dim">  ·  </tspan><tspan class="warn">▲ 1 warning</tspan></text>
  <text x="1196" y="172"><tspan class="err">✗ L23:11</tspan>  unknown attack <tspan class="s">'pa'</tspan></text>
  <text class="dim" x="1196" y="194">           did you mean pair, pap?</text>
  <text x="1196" y="224"><tspan class="warn">▲ L30</tspan>     judge reuses target endpoint</text>
  <text class="dim" x="1196" y="246">           :8000 — self-judging bias</text>
  <text class="ok" x="1196" y="278">✓ dataset · target · execution</text>
  <text class="dim small" x="1196" y="302">click an issue to jump to its line</text>

  <rect class="panel" x="1176" y="330" width="484" height="210"/>
  <text class="title" x="1196" y="356">RUN PLAN</text>
  <text class="dim small" x="1640" y="356" text-anchor="end">last valid · 4 s ago</text>
  <line class="sep" x1="1176" y1="372" x2="1660" y2="372"/>
  <text x="1196" y="398"><tspan class="n">25</tspan>     goals    <tspan class="dim">harmbench · limit 25</tspan></text>
  <text x="1196" y="422"><tspan class="n">2</tspan>      attacks  <tspan class="dim">tap, crescendo</tspan></text>
  <text x="1196" y="446"><tspan class="n">2</tspan>      judges   <tspan class="dim">majority ≥ 7.0</tspan></text>
  <text x="1196" y="470"><tspan class="n">50</tspan>     goal × attack searches</text>
  <text x="1196" y="494"><tspan class="n">3</tspan>      endpoints <tspan class="dim">:8000 :8001 :8002</tspan></text>
  <text x="1196" y="518"><tspan class="dim">→ ./logs/runs  json, jsonl</tspan></text>

  <rect class="panel" x="1176" y="552" width="484" height="208"/>
  <text class="title" x="1196" y="578">AT CURSOR</text>
  <text class="k small" x="1640" y="578" text-anchor="end">attacks[2].name</text>
  <line class="sep" x1="1176" y1="594" x2="1660" y2="594"/>
  <text x="1196" y="620">Attack technique. Iterative ones search</text>
  <text x="1196" y="642">against the target and need an</text>
  <text x="1196" y="664"><tspan class="k">attacker</tspan> role.</text>
  <text class="dim small" x="1196" y="694">baseline  bon  cipherchat  crescendo</text>
  <text class="dim small" x="1196" y="714">flipattack  h4rm3l  pair  pap  tap</text>
  <text class="dim small" x="1196" y="734">advprefix  rag  autodan_turbo  …</text>

  <rect x="1188" y="774" width="212" height="40" fill="#10151c" stroke="#6e7681" stroke-width="1.5"/>
  <text x="1294" y="799" text-anchor="middle">Save</text>
  <rect x="1412" y="774" width="236" height="40" fill="#1c1f24" stroke="#3b3f45" stroke-width="1.5"/>
  <text class="dim" x="1530" y="799" text-anchor="middle">Run Campaign</text>
  <text class="dim small" x="1418" y="846" text-anchor="middle">fix 1 error to enable run · runs a frozen snapshot</text>

