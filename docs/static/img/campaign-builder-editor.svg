  <text class="h1" x="36" y="40">HackAgent  <tspan class="dim">/</tspan>  Campaign Builder</text>
  <text x="836" y="39" text-anchor="middle">campaign.yaml <tspan class="warn">●</tspan> <tspan class="dim">modified</tspan></text>
  <text x="1636" y="39" text-anchor="end"><tspan class="dim">Draft · </tspan><tspan class="err">1 error</tspan><tspan class="dim"> · </tspan><tspan class="warn">1 warning</tspan></text>

  <!-- ============ LEFT: outline / insert / templates ============ -->
  <rect class="panel" x="12" y="70" width="298" height="802"/>
