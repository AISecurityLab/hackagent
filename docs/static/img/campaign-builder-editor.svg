  <rect x="482" y="618" width="400" height="122" fill="#151b23" stroke="#3b4757" stroke-width="1.5"/>
  <rect x="483" y="623" width="398" height="21" fill="#23303f"/>
  <text x="494" y="638"><tspan class="s">pair</tspan></text><text class="dim small" x="870" y="638" text-anchor="end">iterative · attacker, scorer?</text>
  <text x="494" y="660"><tspan class="s">pap</tspan></text><text class="dim small" x="870" y="660" text-anchor="end">iterative · attacker</text>
