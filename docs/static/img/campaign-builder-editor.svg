  <text x="36" y="754"><tspan class="acc">(●)</tspan> Concise</text>
  <text x="36" y="778"><tspan class="dim">( )</tspan> Expand defaults</text>
  <text class="key small" x="286" y="778" text-anchor="end">Ctrl+E</text>
  <text x="36" y="806"><tspan class="dim">[x]</tspan> Fold role models</text>

