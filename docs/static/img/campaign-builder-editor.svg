    <text x="366" y="567">21</text><text x="366" y="588">22</text><text x="366" y="609" style="fill:#e6edf3">23</text><text x="366" y="630">24</text>
    <text x="366" y="651">25</text><text x="366" y="672">26</text><text x="366" y="693">27</text><text x="366" y="714">28</text>
    <text x="366" y="735">29</text><text x="366" y="756">30</text><text x="366" y="777">31</text><text x="366" y="798">32</text>
