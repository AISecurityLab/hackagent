  <rect class="panel" x="12" y="886" width="1648" height="44"/>
  <text x="36" y="913"><tspan class="key">Ctrl+S</tspan> Save   <tspan class="key">Ctrl+Space</tspan> Complete   <tspan class="key">Ctrl+I</tspan> Insert   <tspan class="key">F2</tspan> Format   <tspan class="key">Ctrl+E</tspan> Expand defaults   <tspan class="key">F8</tspan> Next issue   <tspan class="key">Ctrl+R</tspan> Run   <tspan class="key">Esc</tspan> Outline   <tspan class="key">Q</tspan> Quit</text>
