  <text class="err small" x="331" y="609">●</text>
  <text class="warn small" x="331" y="756">▲</text>

  <!-- code -->
  <text x="392" y="147"><tspan class="k">version</tspan><tspan class="p">: </tspan><tspan class="n">1</tspan></text>
  <text x="392" y="168"><tspan class="k">campaign</tspan><tspan class="p">:</tspan></text>
  <text x="392" y="189">  <tspan class="k">name</tspan><tspan class="p">: </tspan><tspan class="s">local-safety-evaluation</tspan></text>

  <text x="392" y="231"><tspan class="k">dataset</tspan><tspan class="p">:</tspan></text>
  <text x="392" y="252">  <tspan class="k">preset</tspan><tspan class="p">: </tspan><tspan class="s">harmbench</tspan></text>
  <text x="392" y="273">  <tspan class="k">selection</tspan><tspan class="p">:</tspan></text>
  <text x="392" y="294">    <tspan class="k">limit</tspan><tspan class="p">: </tspan><tspan class="n">25</tspan></text>
  <text class="ghost" x="392" y="315">    shuffle: false                    ◦ default, safe to delete</text>

  <text x="392" y="357"><tspan class="k">target</tspan><tspan class="p">:</tspan></text>
  <text x="392" y="378">  <tspan class="k">name</tspan><tspan class="p">: </tspan><tspan class="s">google/gemma-3-4b-it</tspan></text>
  <text x="392" y="399">  <tspan class="k">connection</tspan><tspan class="p">: </tspan><tspan class="fold">▸ vllm · OPENAI_SDK · 127.0.0.1:8000</tspan><tspan class="ghost">   ⋯ 4 lines</tspan></text>
  <text x="392" y="420">  <tspan class="k">generation</tspan><tspan class="p">: { </tspan><tspan class="k">max_tokens</tspan><tspan class="p">: </tspan><tspan class="n">512</tspan><tspan class="p">, </tspan><tspan class="k">temperature</tspan><tspan class="p">: </tspan><tspan class="n">0.6</tspan><tspan class="p"> }</tspan></text>

  <text x="392" y="462"><tspan class="k">attacks</tspan><tspan class="p">:</tspan></text>
  <text x="392" y="483">  <tspan class="p">- </tspan><tspan class="k">name</tspan><tspan class="p">: </tspan><tspan class="s">tap</tspan></text>
  <text x="392" y="504">    <tspan class="k">parameters</tspan><tspan class="p">: { </tspan><tspan class="k">depth</tspan><tspan class="p">: </tspan><tspan class="n">3</tspan><tspan class="p">, </tspan><tspan class="k">width</tspan><tspan class="p">: </tspan><tspan class="n">4</tspan><tspan class="p">, </tspan><tspan class="k">branching_factor</tspan><tspan class="p">: </tspan><tspan class="n">3</tspan><tspan class="p"> }</tspan></text>
  <text x="392" y="525">    <tspan class="k">roles</tspan><tspan class="p">: </tspan><tspan class="fold">▸ attacker, on_topic</tspan><tspan class="ghost">   ⋯ 16 lines</tspan></text>
  <text x="392" y="546">  <tspan class="p">- </tspan><tspan class="k">name</tspan><tspan class="p">: </tspan><tspan class="s">crescendo</tspan></text>
  <text x="392" y="567">    <tspan class="k">parameters</tspan><tspan class="p">: { </tspan><tspan class="k">max_turns</tspan><tspan class="p">: </tspan><tspan class="n">10</tspan><tspan class="p">, </tspan><tspan class="k">max_backtracks</tspan><tspan class="p">: </tspan><tspan class="n">10</tspan><tspan class="p"> }</tspan></text>
  <text x="392" y="588">    <tspan class="k">roles</tspan><tspan class="p">: </tspan><tspan class="fold">▸ attacker</tspan><tspan class="ghost">   ⋯ 8 lines</tspan></text>
  <text x="392" y="609">  <tspan class="p">- </tspan><tspan class="k">name</tspan><tspan class="p">: </tspan><tspan class="s">pa</tspan></text>
  <path d="M482 614 l3 -3 l3 3 l3 -3 l3 3 l3 -3 l3 3" fill="none" stroke="#f85149" stroke-width="1.5"/>
  <rect x="501" y="595" width="2" height="19" fill="#e6edf3"/>

  <text x="392" y="651"><tspan class="k">evaluation</tspan><tspan class="p">:</tspan></text>
  <text x="392" y="672">  <tspan class="k">aggregation</tspan><tspan class="p">: </tspan><tspan class="s">majority</tspan></text>
  <text x="392" y="693">  <tspan class="k">threshold</tspan><tspan class="p">: </tspan><tspan class="n">7.0</tspan></text>
  <text x="392" y="714">  <tspan class="k">judges</tspan><tspan class="p">:</tspan></text>
  <text x="392" y="735">    <tspan class="p">- </tspan><tspan class="k">name</tspan><tspan class="p">: </tspan><tspan class="s">cais/HarmBench-Mistral-7b-val-cls</tspan><tspan class="ghost">   ⋯ 12 lines</tspan></text>
  <text x="392" y="756">    <tspan class="p">- </tspan><tspan class="k">name</tspan><tspan class="p">: </tspan><tspan class="s">google/gemma-3-4b-it</tspan><tspan class="ghost">   ⋯ 12 lines   </tspan><tspan class="warn small">▲ same endpoint as target</tspan></text>
  <path d="M500 761 h180" stroke="#d29922" stroke-width="1.5" stroke-dasharray="3 3"/>

  <text x="392" y="798"><tspan class="k">execution</tspan><tspan class="p">:</tspan></text>
  <text x="392" y="819">  <tspan class="k">on_error</tspan><tspan class="p">: </tspan><tspan class="s">continue</tspan></text>
  <text x="392" y="840">  <tspan class="k">per_attack_timeout</tspan><tspan class="p">: </tspan><tspan class="n">1800</tspan><tspan class="ghost">        + 14 defaults hidden · Ctrl+E</tspan></text>

