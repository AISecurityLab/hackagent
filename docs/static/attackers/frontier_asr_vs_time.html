      lastW = w; lastH = h;
      if (window.Plotly) Plotly.Plots.resize(gd);
    }
  }).observe(gd);
}
// ---- custom legend bar (native legend is disabled on the web copy) ----
// Layout: body = flex column; the plot flexes to fill; the bar sits beneath
// it. Per legendgroup: group header with think-ON/OFF entries stacked under
// it; groups laid out side by side (wraps on narrow containers). Swatches
// match the plot (color + circle/diamond; dashed line for line-only traces).
// Click parity with the native legend: entry toggles its trace, header
// toggles the whole group.
document.body.style.display = 'flex';
document.body.style.flexDirection = 'column';
document.body.style.height = '100%';
gd.style.flex = '1 1 auto';
gd.style.minHeight = '0';
gd.style.width = '100%';
var bar = document.createElement('div'); bar.className = 'aa-legend';
document.body.appendChild(bar);
function toggleIdx(i){
  Plotly.restyle(gd, {visible: gd.data[i].visible === false}, [i]);
}
function toggleGroup(idxs){
  var any = idxs.some(function(i){ return gd.data[i].visible !== false; });
  Plotly.restyle(gd, {visible: !any}, idxs);
}
function swatch(tr){
  var mode = tr.mode || 'markers', mk = tr.marker || {}, col = mk.color;
  if (typeof col !== 'string') col = (tr.line && tr.line.color) || '#9ca3af';
  if (mode.indexOf('lines') >= 0 && mode.indexOf('markers') < 0) {
    var ln = document.createElement('span'); ln.className = 'aa-sw line';
    ln.style.borderTopColor = col;
    var d = (tr.line && tr.line.dash) || 'solid';
    ln.style.borderTopStyle = (d === 'dot') ? 'dotted'
      : (String(d).indexOf('dash') >= 0 ? 'dashed' : 'solid');
    return ln;
  }
  var sym = mk.symbol; if (Array.isArray(sym)) sym = sym[0];
  var el = document.createElement('span');
  el.className = 'aa-sw ' +
    (sym && String(sym).indexOf('diamond') >= 0 ? 'diamond' : 'circle');
  el.style.background = col;
  return el;
}
function mkEntry(e, text, onClick){
  var row = document.createElement('div'); row.className = 'aa-lg-e';
  if (e.trace.visible === false) row.className += ' aa-off';
  row.appendChild(swatch(e.trace));
  var sp = document.createElement('span'); sp.textContent = text;
  row.appendChild(sp);
  row.onclick = onClick;
  return row;
}
function buildLegend(){
  bar.innerHTML = '';
  var groups = {}, order = [];
  gd.data.forEach(function(tr, i){
    var mode = tr.mode || 'markers';
    if (tr.showlegend === false || !tr.name || mode === 'text') return;
    var gk = tr.legendgroup || tr.name;
    if (!groups[gk]) { groups[gk] = {header: null, entries: []}; order.push(gk); }
    var g = groups[gk], parts = tr.name.split(' \u00b7 ');
    if (parts.length >= 2) {
      if (!g.header) g.header = parts[0];
      g.entries.push({idx: i, label: parts.slice(1).join(' \u00b7 '), trace: tr});
    } else {
      g.entries.push({idx: i, label: tr.name, trace: tr, solo: true});
    }
  });
  order.forEach(function(gk){
    var g = groups[gk];
    var box = document.createElement('div'); box.className = 'aa-lg';
    if (g.entries.length === 1) {
      // single entry (with or without header) -> one line, whole box clicks
      var e0 = g.entries[0];
      var text = g.header ? g.header + ' \u00b7 ' + e0.label : e0.label;
      box.appendChild(mkEntry(e0, text, function(ev){
        ev.stopPropagation(); toggleIdx(e0.idx); buildLegend();
      }));
      box.onclick = function(){ toggleGroup([e0.idx]); buildLegend(); };
    } else {
      if (g.header) {
        var h = document.createElement('div'); h.className = 'aa-lg-h';
        h.textContent = g.header;
        h.onclick = function(ev){
          ev.stopPropagation();
          toggleGroup(g.entries.map(function(e){ return e.idx; }));
          buildLegend();
        };
        box.appendChild(h);
      }
      g.entries.forEach(function(e){
        box.appendChild(mkEntry(e, e.label, function(ev){
          ev.stopPropagation(); toggleIdx(e.idx); buildLegend();
        }));
      });
    }
    bar.appendChild(box);
  });
  bar.style.display = order.length ? 'flex' : 'none';
}
buildLegend();
// the bar just claimed height from the plot -> re-fit once (RO catches
// later changes too)
if (window.Plotly) Plotly.Plots.resize(gd);
})();

                        })                };            </script>        </div>
