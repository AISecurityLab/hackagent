# openapi-python-client config for hackagent
# Used by hackagent/storage/_http/api/scripts/generate.py to regenerate the api/ call layer.
# Only the api/ subdirectories are kept from the generated output;
# models and client boilerplate are discarded in favour of
# hackagent/storage/_http/api/models.py (Pydantic v2 via datamodel-code-generator).
#
# openapi-python-client generates attrs-style calls (from_dict / to_dict);
# generate.py translates them to Pydantic v2 (model_validate / model_dump).

project_name_override: "hackagent"
package_name_override: "hackagent"

use_path_prefixes_for_title_model_names: false
field_prefix: ""
