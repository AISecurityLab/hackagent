version: 2
updates:
  # Maintain dependencies for Python (uv)
  - package-ecosystem: "uv"
    directory: "/" # Location of pyproject.toml
    schedule:
      interval: "daily"
    target-branch: "stage"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "bump"
      include: "scope"
    ignore:
      # litellm requires openai<3.0.0, so an openai 3 bump cannot be
      # installed. Drop this once litellm accepts openai 3.
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/" # Location of workflow files
    schedule:
      interval: "daily"
    target-branch: "stage"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
      include: "scope" 