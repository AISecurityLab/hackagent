name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  # Called by release.yml once it has tagged a merge to main. A tag pushed with
  # GITHUB_TOKEN never triggers a workflow, so the release cannot rely on the
  # push trigger above and calls this workflow directly instead.
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish.
        required: true
        type: string

env:
  UV_VERSION: "0.10.11"
  # Version of the published dashboard (hackagent-webui on PyPI, built from
  # AISecurityLab/hackagent-webapp) that release artifacts bundle. Pinned to an
  # exact version so rebuilding a tag reproduces the same UI; bump deliberately,
  # and keep it inside the range of the `web` extra in pyproject.toml.
  WEBUI_VERSION: "0.2.0"

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # On a tag push this is already the tag; when this workflow is
          # called, the caller's ref is main, whose tip is not necessarily
          # the commit that was tagged.
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Extract changelog section for this tag
        # Fail before build/publish so a missing section cannot leave a PyPI
        # package without a matching GitHub Release.
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python scripts/extract_changelog_section.py "$RELEASE_TAG" \
            --changelog CHANGELOG.md \
            --output "${RUNNER_TEMP}/release-notes.md"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Fetch the dashboard bundle
        # Take the published artifact rather than rebuilding it from the webapp
        # sources: it is the same wheel `pip install 'hackagent[web]'` gets, so
        # a release binary and a pip install serve identical assets, and this
        # repository's release pipeline needs no Node toolchain.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --target "${RUNNER_TEMP}/webui" "hackagent-webui==${WEBUI_VERSION}"
          python - <<'PY'
          import os, shutil, sys
          sys.path.insert(0, os.path.join(os.environ["RUNNER_TEMP"], "webui"))
          from hackagent_webui import __version__, bundle_path
          dest = os.path.join("hackagent", "interfaces", "web", "static")
          shutil.copytree(bundle_path(), dest, dirs_exist_ok=True)
          print(f"staged hackagent-webui {__version__} into {dest}")
          PY

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: false

  build-binaries:
    name: Build binary (${{ matrix.target }})
    # Wait for the release to exist so the asset uploads attach to it instead of
    # racing the publish job to create it (which would drop the changelog body).
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            archive: tar.gz
          - os: macos-latest
            target: macos-arm64
            archive: tar.gz
          - os: windows-latest
            target: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # On a tag push this is already the tag; when this workflow is
          # called, the caller's ref is main, whose tip is not necessarily
          # the commit that was tagged.
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Fetch the dashboard bundle
        # Take the published artifact rather than rebuilding it from the webapp
        # sources: it is the same wheel `pip install 'hackagent[web]'` gets, so
        # a release binary and a pip install serve identical assets, and this
        # repository's release pipeline needs no Node toolchain.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --target "${RUNNER_TEMP}/webui" "hackagent-webui==${WEBUI_VERSION}"
          python - <<'PY'
          import os, shutil, sys
          sys.path.insert(0, os.path.join(os.environ["RUNNER_TEMP"], "webui"))
          from hackagent_webui import __version__, bundle_path
          dest = os.path.join("hackagent", "interfaces", "web", "static")
          shutil.copytree(bundle_path(), dest, dirs_exist_ok=True)
          print(f"staged hackagent-webui {__version__} into {dest}")
          PY

      - name: Install build dependencies
        run: uv sync --no-default-groups --group binaries

      - name: Build binary
        env:
          HACKAGENT_BUILD_VERSION: ${{ inputs.tag || github.ref_name }}
        run: uv run --no-sync pyinstaller --noconfirm packaging/hackagent.spec

      - name: Smoke test binary (Unix)
        if: runner.os != 'Windows'
        run: |
          ./dist/hackagent/hackagent --version
          ./dist/hackagent/hackagent version
          ./dist/hackagent/hackagent scan --help
          # The dashboard must be inside the archive, not rebuilt at runtime.
          ./dist/hackagent/hackagent web --no-browser --port 7871 &
          pid=$!
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7871/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:7871/healthz | tee health.json
          grep -q '"mode"' health.json
          curl -fsS http://127.0.0.1:7871/ | grep -qi "<html"
          kill "$pid" 2>/dev/null || true

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Frozen binaries inherit the console code page (typically cp1252).
          # Do not set PYTHONIOENCODING: that would hide encoding regressions.
          PYTHONUTF8: "0"
        run: |
          if ($env:PYTHONIOENCODING) { Remove-Item Env:PYTHONIOENCODING }
          chcp 1252 | Out-Null
          $ErrorActionPreference = 'Stop'
          & .\dist\hackagent\hackagent.exe --version
          if ($LASTEXITCODE -ne 0) { throw "hackagent --version exited $LASTEXITCODE" }
          & .\dist\hackagent\hackagent.exe version
          if ($LASTEXITCODE -ne 0) { throw "hackagent version exited $LASTEXITCODE" }
          & .\dist\hackagent\hackagent.exe scan --help
          if ($LASTEXITCODE -ne 0) { throw "hackagent scan --help exited $LASTEXITCODE" }

      - name: Smoke test TUI launch (Unix)
        if: runner.os != 'Windows'
        env:
          TERM: xterm-256color
        run: |
          # No subcommand launches the Textual TUI. Start it, let it settle,
          # then kill it: still running after the wait means it came up cleanly.
          ./dist/hackagent/hackagent < /dev/null > tui.log 2>&1 &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            cat tui.log
          else
            set +e
            wait "$pid"
            status=$?
            set -e
            cat tui.log
            if [ "$status" -ne 0 ]; then
              echo "TUI failed to launch (exit $status)"
              exit 1
            fi
          fi

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        env:
          # workflow_call leaves GITHUB_REF_NAME as the caller ref (main);
          # prefer the resolved tag so assets are hackagent-<version>-...
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          NAME="hackagent-${VERSION}-${{ matrix.target }}"
          mv dist/hackagent "dist/${NAME}"
          tar -czf "${NAME}.tar.gz" -C dist "${NAME}"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = "${env:RELEASE_TAG}" -replace '^v', ''
          $name = "hackagent-$version-${{ matrix.target }}"
          Move-Item dist/hackagent "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip"

      - name: Attach archive to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: hackagent-*.${{ matrix.archive }}
