name: Release

# Every merge into main is a candidate release. Commitizen reads the
# conventional-commit messages since the last tag, decides the next version,
# writes it into pyproject.toml and CHANGELOG.md, and tags the result; the
# publish workflow then builds and ships that tag.
#
# A merge that carried nothing releasable — chores, dependency bumps, docs-only
# changes — produces no tag and no release, so this is safe to run on every push.

on:
  push:
    branches: [main]
  # Re-run a release that failed after tagging, or cut one by hand.
  workflow_dispatch:

env:
  UV_VERSION: "0.10.11"

concurrency:
  # Never let two releases interleave: they would race on the version in
  # pyproject.toml and could publish the same number twice.
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.bump.outputs.released }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Commitizen needs the full history and the existing tags to work out
          # which commits are new and what the last version was.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Bump the version and tag
        id: bump
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          status=0
          uv tool run --from commitizen cz bump --yes --changelog || status=$?

          # 21 is commitizen's NoneIncrementExit — commits exist but none of
          # them warrant a version change; 3 is NoCommitsFoundError, nothing at
          # all since the last tag. Dependabot's "bump(deps):" subject is not a
          # conventional type, so dependency-only merges land in the first case.
          if [[ "${status}" -eq 21 || "${status}" -eq 3 ]]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since the last tag; nothing to do."
            exit 0
          fi
          if [[ "${status}" -ne 0 ]]; then
            echo "::error::commitizen failed with exit code ${status}"
            exit "${status}"
          fi

          TAG="$(git describe --tags --abbrev=0)"
          echo "Tagged ${TAG}"

          # The bump commit has to reach main for the next release to compute
          # from the right base. Pushed with GITHUB_TOKEN, which bypasses the
          # branch ruleset as an integration and — deliberately — triggers no
          # further workflow, so this cannot loop.
          git push origin HEAD:main
          git push origin "${TAG}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Summarise
        run: |
          if [[ "${{ steps.bump.outputs.released }}" == "true" ]]; then
            echo "### Released ${{ steps.bump.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No release — no eligible commits since the last tag" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish
    needs: tag
    if: needs.tag.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
