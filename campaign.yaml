  - name: tap
    parameters:
      depth: 3             # refinement rounds
      width: 4             # branches kept after each score prune
      branching_factor: 3  # refinements per branch per round
      streams: 4           # conversations the tree starts from
    roles:
      attacker:            # required: it refines each branch's prompt
        name: huihui-ai/Huihui-Qwen3-4B-Instruct-2507-abliterated
        connection:
          provider: vllm
          type: OPENAI_SDK
          endpoint: http://127.0.0.1:8002/v1
          timeout: 300
        generation:
          max_tokens: 512
          temperature: 1.0
      on_topic:            # optional: drops branches that drifted off the
        name: huihui-ai/Huihui-Qwen3-4B-Instruct-2507-abliterated
        connection:
          provider: vllm
          type: OPENAI_SDK
          endpoint: http://127.0.0.1:8002/v1
          timeout: 300
        generation:
          max_tokens: 500
          temperature: 1.0

  - name: crescendo
    parameters:
      max_turns: 10        # turns the conversation may grow to
      max_backtracks: 10   # rephrasings allowed when the target refuses
    roles:
      attacker:            # required: it proposes each next question
        name: huihui-ai/Huihui-Qwen3-4B-Instruct-2507-abliterated
        connection:
          provider: vllm
          type: OPENAI_SDK
          endpoint: http://127.0.0.1:8002/v1
          timeout: 300
        generation:
          max_tokens: 500
          temperature: 1.0

  - name: advprefix
    parameters:
      samples_per_prefix: 4      # candidates per opening (paper: 50-150)
      candidates_per_goal: 5     # carried into the attack (paper: 100)
      samples_per_candidate: 4   # completions per candidate (paper: 25)
      prefixes_per_goal: 1       # marked as the goal's result
      prefill: true              # the prefix goes in the assistant turn
    roles:
      attacker:            # required: the uncensored prefix writer
        name: huihui-ai/Huihui-Qwen3-4B-Instruct-2507-abliterated
        connection:
          provider: vllm
          type: OPENAI_SDK
          endpoint: http://127.0.0.1:8002/v1
          timeout: 300
        generation:
          max_tokens: 100
          temperature: 0.7

