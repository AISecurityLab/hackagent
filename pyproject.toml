[project]
name = "hackagent"
version = "0.12.0"
description = "HackAgent is an open-source security toolkit to detect vulnerabilities of your AI Agents."
authors = [
    {name = "AI Security Lab", email = "ais@ai4i.it"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["security", "ai", "agents", "vulnerabilities", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic[email]>=2.0",
    "litellm>=1.69.2",
    "openai>=1.0.0",
    "rich>=14.0.0",
    "click>=8.1.0",
    "pyyaml>=6.0.0",
    "python-dateutil>=2.8.0",
]


[dependency-groups]
dev = [
    "datamodel-code-generator[http,ruff]>=0.54.0",
    "openapi-python-client>=0.24.3,<0.29.0",
    "ruff>=0.11.9",
    "pytest>=8.3.5",
    "pre-commit>=4.2.0",
    "commitizen>=4.7.1",
    "pytest-cov>=6.1.1",
    "pytest-rerunfailures>=14.0",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
    "google-adk>=1.4.2",
    "anyio>=4.3.0",
    "pytest-asyncio>=0.23.7,<1.5.0",
    "mcp>=1.21.2",
    "vllm>=0.11.0; sys_platform != 'win32'",
    "transformers>=4.40,<6.0; sys_platform != 'win32'",
    "pytest-textual-snapshot>=1.1.0",
    "import-linter>=2.3",
    # Optional runtime extras, installed here so unit tests and the docs
    # generator can import every module. A bare `pip install hackagent`
    # does not get them.
    "textual>=1.0.0",
    "flask>=3.1.3",
    "playwright>=1.40",
    "faiss-cpu>=1.13.2",
    "numpy>=1.26",
    "Pillow>=10.0.0",
    "datasets>=2.14.0",
]
docs = [
    "pydoc-markdown>=4.8.2",
    "toml>=0.10.2",
    "packaging>=24,<27",
]
binaries = [
    "pyinstaller>=6.0",
    # The frozen app bundles the optional interfaces and technique extras.
    "textual>=1.0.0",
    "flask>=3.1.3",
    "playwright>=1.40",
    "faiss-cpu>=1.13.2",
    "numpy>=1.26",
    "Pillow>=10.0.0",
    "datasets>=2.14.0",
]

[project.optional-dependencies]
# Interface and technique extras. `pip install hackagent` stays importable
# without them: the package root does not import textual, flask, playwright,
# faiss, numpy, Pillow, or datasets.
tui = ["textual>=1.0.0"]
# Flask serves the local dashboard. hackagent-webui is the published bundle
# from the hackagent-webapp repository, kept out of the base wheel so an
# install that never opens `hackagent web` does not carry ~0.9 MB of frontend
# assets. Release binaries bundle the same assets directly.
#
# A wide range rather than a pin, so dashboard fixes reach users without a
# hackagent release. The bound stays below 1.0 because the dashboard is
# pre-1.0: its own minor releases may change the API contract it speaks, and
# that contract is what has to match this package's offline implementation.
# Note the upper bound must admit a *stable* release — hackagent-webapp also
# publishes .devN pre-releases from its stage branch, which pip ignores.
web = [
    "flask>=3.1.3",
    "hackagent-webui>=0.2,<1.0",
]
browser = ["playwright>=1.40"]
# faiss and numpy. h4rm3l and embedding health checks use numpy as well.
rag = [
    "faiss-cpu>=1.13.2",
    "numpy>=1.26",
]
vision = ["Pillow>=10.0.0"]
hf = ["datasets>=2.14.0"]

[project.scripts]
hackagent = "hackagent.interfaces.cli.main:main"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hackagent"]
# `artifacts` re-includes paths that .gitignore excludes. The web UI bundle is
# a build output (scripts/build_webui.sh) but must ship in the wheel, otherwise
# `hackagent web` has nothing to serve.
artifacts = [
    "hackagent/examples/**",
    "hackagent/interfaces/web/static/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "/hackagent",
    "/assets",
]

[tool.coverage.run]
data_file = "reports/.coverage"
source = ["hackagent"]
omit = [
    # The whole TUI tree, including nested views and widgets.
    "hackagent/interfaces/tui/**",
]

[tool.coverage.report]
fail_under = 50
precision = 1
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "@overload",
  'if __name__ == "__main__":',
  "if TYPE_CHECKING:",
]

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
addopts = "--ignore=tests/e2e/attacks --timeout=120"
markers = [
    "integration: marks integration tests (use --run-integration to enable)",
    "ollama: marks tests that require a running Ollama instance",
    "openai_sdk: marks tests that require OpenAI/OpenRouter API key",
    "google_adk: marks tests that require a live Google ADK server (use --run-google-adk to enable)",
    "litellm: marks tests that require a LiteLLM-compatible backend",
    "e2e: marks end-to-end tests that require external services",
    "hackagent_backend: marks tests that require the HackAgent backend API",
    "slow: marks slow-running tests (excluded from CI, run nightly)",
]

[tool.datamodel-codegen]
# Generation options – input/output are supplied at call time via scripts/generate_models.sh
input-file-type = "openapi"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.10"
capitalise-enum-members = true
collapse-root-models = true
enable-faux-immutability = true
field-constraints = true
formatters = ["ruff-format", "ruff-check"]
reuse-model = true
set-default-enum-member = true
snake-case-field = true
strict-nullable = true
use-annotated = true
use-double-quotes = true
use-field-description = true
use-standard-collections = true

[tool.ruff]
# Ruff 0.16 started linting and formatting Python code blocks inside Markdown.
# Documentation snippets are illustrative and not part of the source tree.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Ruff 0.16 widened its implicit default rule selection. Pin the rule set the
# codebase was linted against so version bumps do not silently add new rules.
select = ["E4", "E7", "E9", "F"]

[tool.importlinter]
root_packages = ["hackagent"]
include_external_packages = true
contract_types = [
    "logging_handlers: lint.import_contracts.LoggingHandlersContract",
]

[[tool.importlinter.contracts]]
name = "Layered packages"
type = "layers"
layers = [
    "hackagent.interfaces",
    "hackagent.client",
    "hackagent.orchestrator",
    # Depth 0. Pipes mean these siblings may not import each other.
    "hackagent.catalog | hackagent.attacks | hackagent.models | hackagent.storage | hackagent.evaluation | hackagent.datasets | hackagent.tracking",
    "hackagent.core",
]
ignore_imports = [
    # Techniques still construct trackers and accept a Store on the obsolete
    # constructor, and LLMRouter still builds role models. Those edges are
    # concentrated in legacy_seams; every other sibling import is forbidden.
    "hackagent.attacks._lib.legacy_seams -> hackagent.tracking",
    "hackagent.attacks._lib.legacy_seams -> hackagent.storage.store",
    "hackagent.attacks._lib.legacy_seams -> hackagent.models.client",
    "hackagent.attacks._lib.legacy_seams -> hackagent.models.factory",
]

[[tool.importlinter.contracts]]
name = "Depth-0 packages are mutually independent"
type = "independence"
modules = [
    "hackagent.catalog",
    "hackagent.attacks",
    "hackagent.models",
    "hackagent.storage",
    "hackagent.evaluation",
    "hackagent.datasets",
    "hackagent.tracking",
]
ignore_imports = [
    "hackagent.attacks._lib.legacy_seams -> hackagent.tracking",
    "hackagent.attacks._lib.legacy_seams -> hackagent.storage.store",
    "hackagent.attacks._lib.legacy_seams -> hackagent.models.client",
    "hackagent.attacks._lib.legacy_seams -> hackagent.models.factory",
]

[[tool.importlinter.contracts]]
name = "storage._http is private"
type = "protected"
protected_modules = ["hackagent.storage._http"]
allowed_importers = ["hackagent.storage.remote"]
as_packages = true

[[tool.importlinter.contracts]]
name = "textual, flask, and click stay under interfaces"
type = "forbidden"
source_modules = ["hackagent"]
forbidden_modules = ["textual", "flask", "click"]
ignore_imports = [
    # External packages are recorded as their top-level module.
    "hackagent.interfaces.** -> textual",
    "hackagent.interfaces.** -> flask",
    "hackagent.interfaces.** -> click",
]

[[tool.importlinter.contracts]]
name = "No logging-handler setup outside interfaces"
type = "logging_handlers"
